name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Standalone client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: forgeflag-linux-x86_64
          - os: macos-latest
            asset: forgeflag-macos-arm64
          - os: windows-latest
            asset: forgeflag-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build deps
        run: pip install -e . pyinstaller
      - name: Build standalone executable
        run: pyinstaller --clean --noconfirm forgeflag.spec
      - name: Smoke test executable
        shell: bash
        run: |
          ./dist/forgeflag --db .forgeflag/release.sqlite init
          ./dist/forgeflag --db .forgeflag/release.sqlite add-challenge release-check --category misc
          ./dist/forgeflag --db .forgeflag/release.sqlite run-all --rounds 1 --attempts 1
      - name: Rename artifact
        shell: bash
        run: cp dist/forgeflag* "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}

  build-sdist-wheel:
    name: Python sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
