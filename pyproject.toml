[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeflag"
version = "0.1.0"
description = "A scoped multi-agent CTF competition assistant architecture."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ForgeFlag Team" }]
dependencies = []

[project.scripts]
forgeflag = "forgeflag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

