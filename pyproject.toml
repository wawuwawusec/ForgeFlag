[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ForgeFlag"
version = "0.11.0"
description = "A scoped multi-agent CTF competition assistant architecture."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ForgeFlag Team" }]
license = { text = "MIT" }
dependencies = ["capstone>=5", "cryptography>=41", "Pillow>=10", "python-registry>=1.3", "z3-solver>=4.12"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/wawuwawusec/ForgeFlag"

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0,<2"]
build = ["pyinstaller>=6.6"]

[project.scripts]
forgeflag = "forgeflag.cli:main"
forgeflag-mcp = "forgeflag.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
